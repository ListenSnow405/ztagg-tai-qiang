<!-- 《I.L.Y.》第三章 S02 电量耗尽提示：状态栏"红色见底"电池图标。
     用途：.phone-notice .phone-screen::after 覆盖 phone-frame.webp 自带的绿色满格电池。
     坐标：viewBox 19x26 对应原图 435x1496 的 x57~76 / y188~213，1:1 像素映射。
     形状：上半圆（r8.5）+ 下矩形（17x13.5）取并集，只描外轮廓 —— 两者重叠处的那条横边
     必须去掉，故用单条 path 而非两个图形叠加。圆心落在矩形顶边上，拱顶 y0.5 正好是像素中心，
     与左右竖边一样是 1px 实心；描边中心亦对准 x0.5 / x17.5 / y22.5，避免发虚。
     垫底矩形必须吃到 y0（原图188）：机模在电池上方还画了一条横条及其向下渐变的阴影
     （y188~190 由 #EFF0F2 渐暗到 #C3C3C3），须一并盖掉，电池上方才干净。
     绘制顺序：垫底 → 红条 → 轮廓描边。红条先画，其直角由轮廓描边压掉。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 19 26" width="19" height="26">
  <!-- 垫底：盖掉原图绿色满格电池 + 上方横条及阴影 -->
  <rect x="0" y="0" width="19" height="26" fill="#EFF4F0"/>
  <!-- 电量见底：横条贴内部底边（原图 y207~209，约占槽高 1/4） -->
  <rect x="1.1" y="19" width="15.8" height="2.9" fill="#CF3A28"/>
  <!-- 电池轮廓：左下 → 左上 → 上半圆 → 右上 → 右下 → 闭合。
       半圆直径 = 矩形宽（17），圆心 (9,9) 落在矩形顶边上，拱顶到 y0.5（原图 y188.5）。 -->
  <path d="M 0.5 22.5 L 0.5 9 A 8.5 8.5 0 0 1 17.5 9 L 17.5 22.5 Z"
        fill="none" stroke="#27361E" stroke-width="1.2"/>
</svg>
